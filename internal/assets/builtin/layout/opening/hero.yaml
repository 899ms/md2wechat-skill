    - editorial
    - briefing
    - story
    kicker:
    - editorial
    - briefing
    - story
    points:
    - editorial
    - briefing
    - story
    symbol:
    - masthead
    - journal
    - seal
    - orbit
    tags:
    - editorial
    - briefing
    - story
    motion:
    - masthead
    - journal
    - seal
    - orbit
